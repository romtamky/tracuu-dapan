<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cổng Tra Cứu Đề Thi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-xl mb-4 text-center">
    <h1 class="text-xl font-bold text-sky-400">Tra Cứu Đáp Án Đề Thi</h1>
    <p class="text-xs text-slate-400 mt-1">Dành cho cả máy tính thi phòng máy và điện thoại cá nhân</p>
  </header>

  <!-- Mục 1: Bộ công cụ dành cho điện thoại thi trực tiếp -->
  <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-xl p-3.5 mb-4 text-sm">
    <div class="font-semibold text-emerald-400 mb-1 flex items-center gap-1.5">
      <span>📱 Thi trên điện thoại (Bắt chữ tự động):</span>
    </div>
    <p class="text-xs text-slate-300 leading-relaxed">
      Tạo một dấu trang mới trên Safari/Chrome của điện thoại với đường dẫn sau:
    </p>
    <div class="mt-2 flex gap-2">
      <input id="bmCode" readonly class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-400 font-mono select-all">
      <button onclick="copyBookmarklet()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1 rounded font-medium shrink-0">Sao chép</button>
    </div>
  </div>

  <!-- Mục 2: Tra chữ nhanh (Dành cho máy tính không cài đặt được) -->
  <div class="sticky top-2 w-full max-w-xl z-50 bg-slate-950/90 backdrop-blur pb-2">
    <div class="relative">
      <input 
        id="searchBox" 
        type="text" 
        placeholder="Gõ vài từ khóa trong câu hỏi..." 
        class="w-full bg-slate-900 border border-sky-500 rounded-xl px-4 py-3 pl-11 text-base text-white focus:outline-none focus:ring-2 focus:ring-sky-400 shadow-xl"
        autocomplete="off"
        autofocus
      />
      <svg class="absolute left-3.5 top-3.5 w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
    <div id="status" class="text-xs text-slate-400 mt-1.5 text-right">Đang tải ngân hàng đề...</div>
  </div>

  <!-- Danh sách hiển thị đáp án -->
  <main id="resultList" class="w-full max-w-xl space-y-3 pb-12"></main>

<script>
  let database = [];
  const searchBox = document.getElementById('searchBox');
  const resultList = document.getElementById('resultList');
  const statusEl = document.getElementById('status');
  const bmInput = document.getElementById('bmCode');

  // 1. MÃ BOOKMARKLET VÔ ĐỊCH (Quét mọi ngóc ngách, lấy chữ chứa từ khóa, miễn nhiễm với lỗi đổi tên class)
  const currentOrigin = window.location.origin;
  bmInput.value = `javascript:(function(){var divs=document.getElementsByTagName('div');var arr=[];for(var i=0;i<divs.length;i++){var c=divs[i].className;if(typeof c==='string'&&c.includes('font-semibold')&&c.includes('text-foreground-900')){var txt=divs[i].innerText.trim();if(txt.length>5)arr.push(txt);}}if(arr.length===0){alert('Vẫn không thấy câu hỏi! Bạn thử vuốt màn hình từ trên xuống dưới 1 vòng rồi bấm lại xem sao.');return;}var url='${currentOrigin}/#auto='+encodeURIComponent(JSON.stringify(arr));var newTab=window.open(url,'_blank');if(!newTab){alert('❌ LỖI: Trình duyệt chặn tab mới!\\n\\nVào Cài đặt -> Safari -> Tắt "Chặn Cửa sổ bật lên" (Block Pop-ups).');}})();`;

  function copyBookmarklet() {
    navigator.clipboard.writeText(bmInput.value);
    alert("Đã sao chép mã Tự Động! Hãy lưu vào dấu trang trên điện thoại.");
  }

  function clean(str) {
    return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').replace(/\s+/g, ' ').trim();
  }

  // 2. TẢI DỮ LIỆU TỪ DATA.JSON
  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      database = data;
      
      // 3. XỬ LÝ TỰ ĐỘNG KHI NHẬN DANH SÁCH CÂU HỎI
      if (window.location.hash.startsWith('#auto=')) {
        try {
          const payload = window.location.hash.replace('#auto=', '');
          const questions = JSON.parse(decodeURIComponent(payload));
          
          document.getElementById('searchBox').parentElement.style.display = 'none'; // Ẩn thanh tìm kiếm
          statusEl.textContent = `Đã tự động giải ${questions.length} câu hỏi từ bài thi!`;
          
          let htmlOut = '';
          questions.forEach((qText, index) => {
            const qClean = clean(qText);
            const match = database.find(item => clean(item.q).includes(qClean) || qClean.includes(clean(item.q)));
            
            if (match) {
              htmlOut += `
                <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl shadow mb-3">
                  <div class="text-xs text-slate-500 mb-1">Câu ${index + 1}:</div>
                  <p class="text-sm font-medium text-slate-200">${qText}</p>
                  <div class="mt-2 pt-2 border-t border-slate-800">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-700">ĐÁP ÁN ĐÚNG</span>
                    <p class="text-base font-bold text-emerald-400 mt-1.5">${match.a}</p>
                  </div>
                </div>`;
            } else {
              htmlOut += `
                <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl shadow mb-3 opacity-50">
                  <div class="text-xs text-slate-500 mb-1">Câu ${index + 1}:</div>
                  <p class="text-sm font-medium text-slate-200">${qText}</p>
                  <div class="mt-2 pt-2 border-t border-slate-800">
                    <p class="text-sm font-bold text-red-400 mt-1.5">❌ Không có trong ngân hàng</p>
                  </div>
                </div>`;
            }
          });
          resultList.innerHTML = htmlOut;
          return;
        } catch(e) {
          alert("Lỗi đọc dữ liệu tự động!");
        }
      }

      // 4. CHẾ ĐỘ TÌM KIẾM THỦ CÔNG
      statusEl.textContent = `Sẵn sàng: ${database.length} câu hỏi`;
      
      searchBox.addEventListener('input', (e) => {
        const q = clean(e.target.value);
        if (q.length < 2) {
          resultList.innerHTML = '';
          statusEl.textContent = `Sẵn sàng: ${database.length} câu hỏi`;
          return;
        }

        const matched = database.filter(item => clean(item.q).includes(q));
        statusEl.textContent = `Tìm thấy: ${matched.length} câu hỏi`;

        if (matched.length === 0) {
          resultList.innerHTML = `<div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center text-slate-400 text-sm">Không có kết quả.</div>`;
          return;
        }

        resultList.innerHTML = matched.map(item => `
          <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl shadow mb-3">
            <p class="text-sm font-medium text-slate-200">${item.q}</p>
            <div class="mt-2 pt-2 border-t border-slate-800">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-700">ĐÁP ÁN ĐÚNG</span>
              <p class="text-base font-bold text-emerald-400 mt-1.5">${item.a}</p>
            </div>
          </div>
        `).join('');
      });

    })
    .catch(() => {
      statusEl.textContent = 'Lỗi nạp file dữ liệu!';
    });
</script>
</body>
</html>
